<nav class="bg-stone-800 text-stone-100 shadow-md">
  <div class="container mx-auto px-4 py-3 flex items-center justify-between">
    <div class="text-xl font-bold">
      <a href="{% url 'index' %}" class="hover:text-indigo-400">InBook</a>
    </div>

    <ul class="hidden md:flex space-x-6">
      <li><a href="{% url 'chat:room_list' %}" class="hover:text-indigo-400 transition">Чати</a></li>
      <li><a href="{% url 'communities_list' %}" class="hover:text-indigo-400 transition">Спільноти</a></li>
      <li><a href="{% url 'friends_list' %}" class="hover:text-indigo-400 transition">Друзі</a></li>
    </ul>

{% if request.user.is_authenticated %}
    <div class="relative" x-data="{ open: false }">
      <!-- Кнопка пользователя -->
      <button
        @click="open = !open"
        class="flex items-center space-x-2 focus:outline-none focus:ring-2 focus:ring-indigo-400 rounded"
      >
        <img src="https://i.pravatar.cc/32" alt="User Avatar" class="w-8 h-8 rounded-full" />
        <span class="hidden sm:block font-medium">Привіт, {{ request.user.username }}</span>
        <svg
          class="w-4 h-4 text-stone-300"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <!-- Выпадающее меню -->
      <div
        x-show="open"
        @click.away="open = false"
        x-transition
        class="absolute right-0 mt-2 w-48 bg-stone-900 rounded-md shadow-lg border border-stone-700 py-1 z-50"
      >
        <a href="{% url 'profile' request.user.id %}" class="block px-4 py-2 text-stone-200 hover:bg-indigo-600 hover:text-white transition">Профіль</a>
        <div class="border-t border-stone-700"></div>
        <a href="{% url 'logout' %}" class="block px-4 py-2 text-red-500 hover:bg-red-600 hover:text-white transition">Вийти</a>

      </div>
    </div>
      {% endif %}
  </div>
</nav>

<!-- Добавь Alpine.js для дропдауна -->
<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
