{% extends "base/_base.html" %}

{% block title %}Удалить сообщество: "{{ community.name }}"{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-8 px-4">
  <h1 class="text-3xl font-semibold mb-4 text-stone-100">Удалить сообщество: "{{ community.name }}"?</h1>
  <p class="mb-6 text-stone-300">
    Это действие необратимо. Все данные, связанные с сообществом, будут удалены.
  </p>

  <form method="post" class="space-x-4">
    {% csrf_token %}
    <button type="submit"
            class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-md font-semibold transition">
      Да, удалить
    </button>
    <a href="{% url 'community_detail' community.pk %}"
       class="inline-block align-middle text-indigo-400 hover:underline font-medium">
      Отмена
    </a>
  </form>
</div>
{% endblock %}
